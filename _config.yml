title: 我的微技能日志
description: 基于罗伯特·特威格尔《微精通》——每周一个 3-5 小时可完成、有明确"最小可演示成果"的微技能方案
url: "https://jiangren.github.io"
baseurl: "/micro-skills"

# 用 remote_theme 拉 Just the Docs(GitHub Pages 原生支持 jekyll-remote-theme)
remote_theme: just-the-docs/just-the-docs

# ---- Just the Docs 配置 ----
color_scheme: light            # 用户可切换暗色(右上角图标)
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true          # 标题悬停出锚点链接
back_to_top: true
back_to_top_text: "回到顶部 ↑"

# 右上角辅助链接
aux_links:
  "在 GitHub 上查看":
    - "https://github.com/jiangren/micro-skills"
aux_links_new_tab: true

# 页脚
footer_content: "© 2026 jiangren · 基于 <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a> 主题构建"

# ---- 插件 ----
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

timezone: Asia/Shanghai

exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
